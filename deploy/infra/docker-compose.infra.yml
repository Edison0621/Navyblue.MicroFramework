services:
  consul-server:
    image: hashicorp/consul:1.19
    restart: unless-stopped
    command: "agent -server -ui -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "${CONSUL_UI_PORT:-8500}:8500"
      - "8600:8600/udp"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:16686"]
      interval: 15s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ../../observability/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
