services:
  consul-agent:
    image: hashicorp/consul:1.19
    restart: unless-stopped
    command: "agent -retry-join=${CONSUL_SERVER_IP} -client=0.0.0.0"
    extra_hosts:
      - "${CONSUL_HOST}:${INFRA_HOST_IP}"
      - "${REDIS_HOST}:${INFRA_HOST_IP}"
      - "${OTEL_HOST}:${INFRA_HOST_IP}"

  registrator:
    image: gliderlabs/registrator:v7
    restart: unless-stopped
    command: "-internal consul://consul-agent:8500"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
    depends_on:
      - consul-agent

  productservice:
    image: productservice:latest
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: samples/ProductService/Dockerfile
    ports:
      - "${PRODUCT_PORT:-5002}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Consul__Address=http://${CONSUL_HOST}:8500
      - Redis__Connection=${REDIS_HOST}:6379
      - Demo__OtlpEndpoint=http://${OTEL_HOST}:4317
    labels:
      - SERVICE_NAME=productservice
      - SERVICE_8080_NAME=productservice
    extra_hosts:
      - "${CONSUL_HOST}:${INFRA_HOST_IP}"
      - "${REDIS_HOST}:${INFRA_HOST_IP}"
      - "${OTEL_HOST}:${INFRA_HOST_IP}"
    depends_on:
      - consul-agent

  productservice-dapr:
    image: daprio/daprd:1.15.14
    restart: unless-stopped
    command:
      - ./daprd
      - --app-id
      - productservice
      - --app-port
      - "8080"
      - --dapr-http-port
      - "3502"
      - --resources-path
      - /components
    network_mode: service:productservice
    volumes:
      - ./components:/components
    extra_hosts:
      - "${CONSUL_HOST}:${INFRA_HOST_IP}"
      - "${REDIS_HOST}:${INFRA_HOST_IP}"
      - "${OTEL_HOST}:${INFRA_HOST_IP}"
    depends_on:
      - productservice

  productservice-canary:
    image: productservice-canary:latest
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: samples/ProductService/Dockerfile
    ports:
      - "${PRODUCT_CANARY_PORT:-5003}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Consul__Address=http://${CONSUL_HOST}:8500
      - Redis__Connection=${REDIS_HOST}:6379
      - Demo__OtlpEndpoint=http://${OTEL_HOST}:4317
    labels:
      - SERVICE_NAME=productservice-canary
      - SERVICE_8080_NAME=productservice-canary
    extra_hosts:
      - "${CONSUL_HOST}:${INFRA_HOST_IP}"
      - "${REDIS_HOST}:${INFRA_HOST_IP}"
      - "${OTEL_HOST}:${INFRA_HOST_IP}"
    depends_on:
      - consul-agent

  productservice-canary-dapr:
    image: daprio/daprd:1.15.14
    restart: unless-stopped
    command:
      - ./daprd
      - --app-id
      - productservice-canary
      - --app-port
      - "8080"
      - --dapr-http-port
      - "3503"
      - --resources-path
      - /components
    network_mode: service:productservice-canary
    volumes:
      - ./components:/components
    extra_hosts:
      - "${CONSUL_HOST}:${INFRA_HOST_IP}"
      - "${REDIS_HOST}:${INFRA_HOST_IP}"
      - "${OTEL_HOST}:${INFRA_HOST_IP}"
    depends_on:
      - productservice-canary
