global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gatewayservice:8080"]

  - job_name: "auth"
    metrics_path: /metrics
    static_configs:
      - targets: ["authservice:8080"]

  - job_name: "catalog"
    metrics_path: /metrics
    static_configs:
      - targets: ["catalogservice:8080"]
